# SonarQube — UpGuard Agent (Go). O token NUNCA entra aqui: vem de SONAR_TOKEN
# (CI) ou de -Dsonar.token na linha de comando. O host vem de SONAR_HOST_URL.
sonar.projectKey=upguard-agent
sonar.projectName=UpGuard Agent
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*_test.go,dist/**,coverage.out
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Cobertura: go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out
