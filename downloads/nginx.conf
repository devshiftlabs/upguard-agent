# Endereço de download do agente (imagem upguard/agent-downloads, ns upguard).
# Publicado em https://upguard.com.br/downloads/agent/ pelo nginx do frontend
# (location /downloads/agent/ -> serviço upguard-agent-downloads).
#
# Cache: latest.json, a assinatura, os instaladores, SHA256SUMS e latest/ mudam
# a cada versão -> no-cache (a Cloudflare e o navegador revalidam).
# v<versão>/ nunca muda -> cache longo.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /downloads/agent/ {
        types {
            application/json json;
            text/plain sig sh ps1;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ /SHA256SUMS$ {
            default_type text/plain;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ~ ^/downloads/agent/v[0-9][^/]*/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    location / {
        return 404;
    }
}
